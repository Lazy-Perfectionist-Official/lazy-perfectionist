<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <title>Admin · Lazy Perfectionist</title>
    <style>
      /* The door matches the print — paper, ink, Courier — for the moment
         before Sveltia takes over the document. */
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        background: #f2e7d5;
        color: #2a1810;
        font-family: "Courier Prime", ui-monospace, monospace;
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- The catalog's back office. Sveltia reads its config from the static
         config.yml beside this page (/admin/config.yml) and talks to GitHub
         directly: sign in with the repo's account (username + a fine-grained
         personal access token, Contents read/write on this one repo), edit,
         save — the commit lands on main and Vercel republishes the site.
         The public pages never load a byte of this. -->
    <script src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.261.0/dist/sveltia-cms.js"></script>
    <noscript>
      <p>The admin needs JavaScript.</p>
    </noscript>
    <p>Opening the back office…</p>
  </body>
</html>
